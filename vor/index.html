<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Širé moře</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/ui.css">
<style>
  /* Single deliberate look: dusk sea, weathered wood, brass. Game is dark-first on purpose. */
  :root {
    color-scheme: dark;
    --sea-deep: #06222b;
    --sea: #0d3b47;
    --foam: #e9f1ea;
    --sand: #e6cf9f;
    --wood: #6b4a2f;
    --brass: #d9a441;
    --coral: #e8643c;
    --ink: #041419;
    --font-display: 'Pirata One', 'Georgia', serif;
    --font-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sea-deep); color: var(--foam); }
  body { font-family: var(--font-body); -webkit-user-select: none; user-select: none; touch-action: none; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; }
  .boot-msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px;
    font-family: var(--font-display); font-size: 42px; color: var(--sand); background: var(--sea-deep); }
  .boot-msg small { display: block; font-family: var(--font-body); font-size: 16px; color: var(--foam); margin-top: 8px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="ui"><div class="boot-msg" id="boot-msg">Širé moře<small>Načítám moře…</small></div></div>
<div id="touch"></div>

<script src="lib/three.min.js"></script>
<script>
  if (!window.THREE) {
    document.getElementById('boot-msg').innerHTML =
      'Širé moře<small>Nepodařilo se načíst 3D knihovnu (soubor lib/three.min.js chybí). Zkus hru přeinstalovat.</small>';
  }
</script>
<script src="js/core.js"></script>
<script src="js/items.js"></script>
<script src="js/world.js"></script>
<script src="js/raft.js"></script>
<script src="js/build.js"></script>
<script src="js/player.js"></script>
<script src="js/debris.js"></script>
<script src="js/fishing.js"></script>
<script src="js/telescope.js"></script>
<script src="js/creatures.js"></script>
<script src="js/pirates.js"></script>
<script src="js/animals.js"></script>
<script src="js/islands.js"></script>
<script src="js/seabed.js"></script>
<script src="js/audio.js"></script>
<script src="js/goals.js"></script>
<script src="js/ui.js"></script>
<script src="js/touch.js"></script>
<script src="js/desktop.js"></script>
<script>
  (function () {
    if (!window.THREE || !window.G) return;
    var probe = document.createElement('canvas');
    var gl = probe.getContext('webgl2') || probe.getContext('webgl');
    if (!gl) {
      document.getElementById('boot-msg').innerHTML =
        'Širé moře<small>Tvůj prohlížeč nepodporuje WebGL, takže 3D hru nejde spustit.</small>';
      return;
    }
    G.boot();
  })();
</script>
</body>
</html>
